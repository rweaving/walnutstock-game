<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#18101e">
  <meta name="description" content="Walnutstock: Three Days of Peace, Shells &amp; Music — 2D Top-Down Festival Exploration RPG">
  <meta property="og:title" content="Walnutstock — Three Days of Peace, Shells &amp; Music">
  <meta property="og:description" content="Explore 5 live concert stages, 30 original sets, 11 walnut cultivars, and Woodstock '69 orchard festivities.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Walnutstock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Shrikhand&display=swap" rel="stylesheet">

  <title>Walnutstock — Three Days of Peace, Shells &amp; Music</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --wl-cream: #f7e6c4;
      --wl-gold: #ffd166;
      --wl-amber: #ff9f1c;
      --wl-coral: #ff006e;
      --wl-mint: #06d6a0;
      --wl-ink: #221309;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #161018;
      color: var(--wl-cream);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* Full-bleed 1969 screen-printed concert poster & perforated gate ticket */
    #walnut-loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 9999;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    #walnut-loader.wl-tearing {
      pointer-events: none;
    }

    /* Upper Poster Half (Zones 1 & 2: Top Poster Header + Unboxed Dusk Stage) */
    #walnut-poster-upper {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding:
        calc(env(safe-area-inset-top, 0px) + clamp(14px, 2.8dvh, 28px))
        clamp(16px, 5vw, 32px)
        0;
      background:
        radial-gradient(circle at 50% 72%, rgba(255, 176, 36, 0.28) 0%, rgba(255, 94, 0, 0.12) 34%, transparent 66%),
        radial-gradient(circle at 20% 24%, rgba(255, 0, 110, 0.19) 0%, transparent 48%),
        radial-gradient(circle at 82% 22%, rgba(131, 56, 236, 0.24) 0%, transparent 50%),
        linear-gradient(180deg, #191129 0%, #2b1832 42%, #442315 80%, #2b170e 100%);
      box-sizing: border-box;
      overflow: hidden;
      transition: transform 0.54s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.48s ease;
    }

    /* Subtle 1969 screen-print paper grain */
    #walnut-poster-upper::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image: radial-gradient(rgba(255, 244, 214, 0.8) 0.75px, transparent 0.75px);
      background-size: 6px 6px;
    }

    #walnut-loader.wl-tearing #walnut-poster-upper {
      transform: translate3d(0, -22%, 0) scale(1.03);
      opacity: 0;
    }

    /* Converging concert stage spotlight beams */
    .wl-beam {
      position: absolute;
      top: -12%;
      width: 44vw;
      max-width: 320px;
      height: 112%;
      pointer-events: none;
      opacity: 0.28;
      filter: blur(16px);
      transform-origin: top center;
    }
    .wl-beam-left {
      left: 4%;
      background: linear-gradient(180deg, rgba(255, 190, 11, 0.72), rgba(255, 159, 28, 0.18) 62%, transparent 88%);
      animation: wl-sway-left 4.8s ease-in-out infinite alternate;
    }
    .wl-beam-right {
      right: 4%;
      background: linear-gradient(180deg, rgba(255, 0, 110, 0.62), rgba(131, 56, 236, 0.18) 62%, transparent 88%);
      animation: wl-sway-right 5.4s ease-in-out infinite alternate;
    }
    .wl-beam-center {
      left: 50%;
      width: 34vw;
      max-width: 240px;
      margin-left: -17vw;
      opacity: 0.18;
      background: linear-gradient(180deg, rgba(6, 214, 160, 0.6), transparent 82%);
      animation: wl-sway-center 6.2s ease-in-out infinite alternate;
    }
    @keyframes wl-sway-left {
      from { transform: rotate(-18deg); }
      to { transform: rotate(-5deg); }
    }
    @keyframes wl-sway-right {
      from { transform: rotate(18deg); }
      to { transform: rotate(5deg); }
    }
    @keyframes wl-sway-center {
      from { transform: rotate(-5deg) scaleX(0.92); }
      to { transform: rotate(5deg) scaleX(1.08); }
    }

    /* Floating dusk orchard fireflies */
    .wl-firefly {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 10px 3px rgba(255, 209, 102, 0.78);
      pointer-events: none;
      animation: wl-float 4.2s ease-in-out infinite;
    }
    .wl-f1 { top: 22%; left: 12%; animation-delay: 0s; }
    .wl-f2 { top: 30%; right: 13%; animation-delay: -1.4s; background: #80ffdb; box-shadow: 0 0 10px 3px rgba(128, 255, 219, 0.72); }
    .wl-f3 { top: 56%; left: 16%; animation-delay: -2.5s; }
    .wl-f4 { top: 52%; right: 16%; animation-delay: -0.8s; background: #ff9f1c; }
    .wl-f5 { top: 38%; left: 26%; width: 4px; height: 4px; animation-delay: -3.1s; background: #ccff33; }
    .wl-f6 { top: 64%; right: 26%; width: 5px; height: 5px; animation-delay: -1.9s; }
    @keyframes wl-float {
      0%, 100% { transform: translate(0, 0) scale(0.82); opacity: 0.32; }
      50% { transform: translate(9px, -15px) scale(1.28); opacity: 0.96; }
    }

    /* Zone 1: Top Poster Header */
    .wl-poster-header {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 460px;
    }

    .wl-pass-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 13px;
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.14);
      border: 1px solid rgba(255, 209, 102, 0.5);
      color: var(--wl-gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: clamp(6px, 1.2dvh, 12px);
    }

    .wl-title {
      margin: 0;
      font-family: 'Shrikhand', cursive;
      font-weight: 400;
      font-size: clamp(32px, 9.2vw, 50px);
      line-height: 1.02;
      letter-spacing: 1.6px;
      color: var(--wl-gold);
      text-shadow:
        0 3px 0 #7f2b0a,
        0 6px 22px rgba(255, 159, 28, 0.36);
    }

    .wl-subtitle {
      margin: clamp(4px, 0.8dvh, 8px) 0 0;
      font-size: clamp(12px, 3.3vw, 14px);
      font-weight: 600;
      color: #f4dfc0;
      letter-spacing: 0.5px;
      opacity: 0.94;
    }

    /* Zone 2: Unboxed Center Stage & Groovy Hippie Walnut Mascot */
    .wl-open-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: clamp(8px, 1.8dvh, 18px);
    }

    /* Curved wooden concert stage deck silhouette along the dusk horizon */
    .wl-stage-arch-floor {
      position: absolute;
      left: -12%;
      right: -12%;
      bottom: -26px;
      height: clamp(64px, 10dvh, 92px);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      background:
        radial-gradient(ellipse at 50% 8%, rgba(255, 209, 102, 0.34) 0%, transparent 62%),
        linear-gradient(180deg, #4b2b17 0%, #29160c 58%, #1c0f08 100%);
      border-top: 2px solid rgba(255, 209, 102, 0.52);
      box-shadow: 0 -12px 34px rgba(255, 159, 28, 0.22);
      pointer-events: none;
    }

    /* Distant orchard silhouette trees flanking the open stage */
    .wl-orchard-treeline {
      position: absolute;
      inset: auto 0 28px 0;
      height: 64px;
      pointer-events: none;
      opacity: 0.45;
      background:
        radial-gradient(circle at 8% 100%, #120b08 36px, transparent 37px),
        radial-gradient(circle at 18% 100%, #170e0a 28px, transparent 29px),
        radial-gradient(circle at 82% 100%, #170e0a 30px, transparent 31px),
        radial-gradient(circle at 92% 100%, #120b08 38px, transparent 39px);
    }

    .wl-mascot-button {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: 0;
      padding: 4px 12px 2px;
      cursor: pointer;
      touch-action: manipulation;
      color: inherit;
      font: inherit;
      outline: none;
    }
    .wl-mascot-button:focus-visible .wl-soundcheck-pill {
      box-shadow: 0 0 0 2px var(--wl-gold);
    }

    /* 168px-190px on portrait phones (375x667 -> 168px, 390x844 -> 190px) */
    #walnut-mascot {
      display: block;
      width: clamp(168px, 22.5dvh, 190px);
      height: clamp(168px, 22.5dvh, 190px);
      animation: wl-groove 0.92s ease-in-out infinite alternate;
      transform-origin: 50% 88%;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.48));
    }
    @keyframes wl-groove {
      0% { transform: translateY(2px) rotate(-3.5deg) scale(1.02, 0.98); }
      100% { transform: translateY(-7px) rotate(3.5deg) scale(0.98, 1.03); }
    }
    #walnut-mascot.wl-jam-pop {
      animation: wl-jam-jump 0.44s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes wl-jam-jump {
      0% { transform: scale(1.12, 0.86) translateY(4px); }
      42% { transform: scale(0.94, 1.14) translateY(-16px) rotate(8deg); }
      78% { transform: scale(1.04, 0.97) translateY(-3px) rotate(-4deg); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    .wl-soundcheck-pill {
      position: relative;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 2px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(18, 11, 7, 0.68);
      border: 1px solid rgba(255, 209, 102, 0.34);
      font-size: 11.5px;
      font-weight: 600;
      color: #ffe8b3;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .wl-groove-pill {
      display: none;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(6, 214, 160, 0.2);
      border: 1px solid rgba(6, 214, 160, 0.65);
      color: #7bf1a8;
      font-size: 10.5px;
      font-weight: 800;
    }

    .wl-note-particle {
      position: absolute;
      pointer-events: none;
      font-size: 20px;
      font-weight: 700;
      color: var(--wl-gold);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      animation: wl-rise 0.95s ease-out forwards;
      z-index: 6;
    }
    @keyframes wl-rise {
      0% { transform: translate(-50%, 0) scale(0.75); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx, 0px)), -78px) scale(1.28) rotate(14deg); opacity: 0; }
    }

    /* Zone 3: Bottom Thumb-Zone Perforated Ticket Stub (lower ~25-28%) */
    #walnut-ticket-lower {
      position: relative;
      z-index: 4;
      flex: 0 0 auto;
      width: 100%;
      background: linear-gradient(180deg, #24140c 0%, #1d100a 18%, #f3dfb9 18.5%, #e3c188 100%);
      color: var(--wl-ink);
      box-sizing: border-box;
      transform-origin: 18% 0%;
      transition: transform 0.56s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.48s ease;
    }

    #walnut-loader.wl-tearing #walnut-ticket-lower {
      transform: translate3d(16px, 112%, 0) rotate(4.2deg);
      opacity: 0;
    }

    /* Single-line merged status & festival rumor ticker directly above perforation */
    .wl-ticker-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px clamp(16px, 5vw, 28px) 9px;
      background: #21120b;
      color: var(--wl-cream);
      font-size: 12px;
      font-weight: 600;
      box-sizing: border-box;
    }

    #walnut-stage-text {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f6e4c4;
      transition: opacity 0.2s ease;
    }

    #walnut-pct {
      flex: 0 0 auto;
      color: var(--wl-gold);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      font-variant-numeric: tabular-nums;
    }

    /* Horizontal serrated ticket perforation line with radial-gradient punch-out teeth */
    .wl-perforation-band {
      position: relative;
      width: 100%;
      height: 18px;
      background:
        radial-gradient(circle at 8px 9px, #140b07 4.3px, transparent 4.8px) repeat-x,
        linear-gradient(180deg, #21120b 0%, #21120b 50%, #f3dfb9 50%, #f3dfb9 100%);
      background-size: 16px 18px, 100% 100%;
      overflow: hidden;
    }

    /* Side semicircular ticket stub punch notches */
    .wl-perforation-band::before,
    .wl-perforation-band::after {
      content: '';
      position: absolute;
      top: -3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #120907;
      z-index: 3;
      box-shadow: inset 0 0 0 1.5px rgba(255, 209, 102, 0.32);
    }
    .wl-perforation-band::before { left: -12px; }
    .wl-perforation-band::after { right: -12px; }

    /* Dashed tear rule + animated golden progress across the perforation */
    .wl-perforation-rule {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 50%;
      height: 4px;
      margin-top: -2px;
      border-radius: 999px;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 209, 102, 0.26) 0px,
        rgba(255, 209, 102, 0.26) 8px,
        transparent 8px,
        transparent 14px
      );
      overflow: hidden;
      z-index: 2;
    }

    #walnut-bar-fill {
      width: 8%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff9f1c 0%, #ffd166 52%, #06d6a0 100%);
      box-shadow: 0 0 12px rgba(255, 209, 102, 0.85);
      transition: width 0.22s ease-out;
    }

    /* Primary Thumb-Zone Perforated Ticket Stub CTA */
    .wl-stub-body {
      padding:
        10px
        clamp(16px, 5vw, 28px)
        calc(env(safe-area-inset-bottom, 0px) + clamp(12px, 2.2dvh, 20px));
      background:
        radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.28), transparent 52%),
        linear-gradient(180deg, #f3dfb9 0%, #e1be82 100%);
      box-sizing: border-box;
    }

    .wl-stub-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: #5c3618;
      margin-bottom: 8px;
    }

    #walnut-tear-stub {
      position: relative;
      width: 100%;
      min-height: 58px;
      border-radius: 14px;
      border: 2px solid #4a2810;
      background: linear-gradient(180deg, #3a2010 0%, #241309 100%);
      color: #e8d3b0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(12.5px, 3.6vw, 15px);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      box-sizing: border-box;
      cursor: default;
      touch-action: none;
      transition: transform 0.16s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    }

    #walnut-tear-stub.wl-ready {
      cursor: pointer;
      border-color: #1f1006;
      background: linear-gradient(135deg, #2b160a 0%, #4b240c 52%, #241208 100%);
      color: var(--wl-gold);
      box-shadow:
        0 8px 22px rgba(34, 19, 9, 0.36),
        0 0 0 2px rgba(255, 209, 102, 0.55);
      animation: wl-stub-pulse 1.5s ease-in-out infinite;
    }

    #walnut-tear-stub.wl-ready:active {
      transform: translateY(2px) scale(0.99);
    }

    @keyframes wl-stub-pulse {
      0%, 100% {
        box-shadow:
          0 6px 18px rgba(34, 19, 9, 0.34),
          0 0 0 2px rgba(255, 209, 102, 0.45);
      }
      50% {
        box-shadow:
          0 10px 26px rgba(255, 159, 28, 0.42),
          0 0 0 4px rgba(255, 209, 102, 0.88);
      }
    }

    .wl-stub-icon {
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* Graceful scaling on ultra-short landscape phones */
    @media (max-height: 580px) {
      .wl-title { font-size: clamp(24px, 6vw, 34px); }
      .wl-pass-pill { margin-bottom: 4px; padding: 2px 10px; font-size: 10px; }
      #walnut-mascot { width: clamp(104px, 24dvh, 148px); height: clamp(104px, 24dvh, 148px); }
      .wl-stub-meta { display: none; }
      .wl-stub-body { padding-top: 6px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
      #walnut-tear-stub { min-height: 48px; }
    }
  </style>
</head>
<body>
  <div id="walnut-loader" role="region" aria-label="Walnutstock 1969 Gate Pass">
    <!-- Upper Screen-Printed 1969 Concert Poster -->
    <div id="walnut-poster-upper">
      <div class="wl-beam wl-beam-left"></div>
      <div class="wl-beam wl-beam-center"></div>
      <div class="wl-beam wl-beam-right"></div>
      <div class="wl-firefly wl-f1"></div>
      <div class="wl-firefly wl-f2"></div>
      <div class="wl-firefly wl-f3"></div>
      <div class="wl-firefly wl-f4"></div>
      <div class="wl-firefly wl-f5"></div>
      <div class="wl-firefly wl-f6"></div>

      <!-- Zone 1: Top Poster Header -->
      <header class="wl-poster-header">
        <div class="wl-pass-pill">✌️ August 1969 · Free Orchard Gate Pass</div>
        <h1 class="wl-title">WALNUTSTOCK</h1>
        <p class="wl-subtitle">Three Days of Peace, Shells &amp; Music</p>
      </header>

      <!-- Zone 2: Unboxed Open Dusk Stage & Mascot -->
      <div class="wl-open-stage" id="walnut-jam-pad">
        <div class="wl-orchard-treeline" aria-hidden="true"></div>
        <div class="wl-stage-arch-floor" aria-hidden="true"></div>

        <button
          type="button"
          class="wl-mascot-button"
          id="walnut-mascot-trigger"
          aria-label="Tap the hippie walnut mascot for a 1969 organ soundcheck"
        >
          <div id="walnut-mascot">
            <svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true">
              <!-- Ground stage spotlight pool -->
              <ellipse cx="60" cy="111" rx="34" ry="7" fill="rgba(255, 209, 102, 0.22)"/>
              <ellipse cx="60" cy="111" rx="26" ry="5" fill="rgba(0, 0, 0, 0.45)"/>
              <!-- Little suede festival boots -->
              <rect x="42" y="96" width="12" height="13" rx="5.5" fill="#5c3419" stroke="#2c1608" stroke-width="1.5"/>
              <rect x="66" y="96" width="12" height="13" rx="5.5" fill="#5c3419" stroke="#2c1608" stroke-width="1.5"/>
              <!-- Grooving arms flashing peace vibes -->
              <path d="M29 66 Q12 53 18 39" fill="none" stroke="#8d582c" stroke-width="6.2" stroke-linecap="round"/>
              <path d="M91 66 Q108 51 102 37" fill="none" stroke="#8d582c" stroke-width="6.2" stroke-linecap="round"/>
              <!-- Textured 1969 Walnut Shell Body -->
              <ellipse cx="60" cy="62" rx="34" ry="38" fill="#b8773a" stroke="#4d2b10" stroke-width="3.4"/>
              <ellipse cx="60" cy="61" rx="27" ry="32" fill="#ce8e4e" opacity="0.76"/>
              <!-- Walnut shell center suture & organic grooves -->
              <path d="M60 25 C56 46, 64 76, 60 99" fill="none" stroke="#683c16" stroke-width="2.4" stroke-dasharray="5 4"/>
              <path d="M37 48 Q46 54 39 66" fill="none" stroke="#78461c" stroke-width="2.1" stroke-linecap="round" opacity="0.7"/>
              <path d="M83 48 Q74 54 81 66" fill="none" stroke="#78461c" stroke-width="2.1" stroke-linecap="round" opacity="0.7"/>
              <path d="M40 73 Q48 78 43 87" fill="none" stroke="#78461c" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
              <path d="M80 73 Q72 78 77 87" fill="none" stroke="#78461c" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
              <!-- Fringed suede vest lapels -->
              <path d="M34 69 L44 88 L33 88 Z" fill="#6f3d1b" opacity="0.88"/>
